<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>雙人決鬥</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">
    <h1>雙人決鬥</h1>
    <section class="online-panel" aria-label="線上對戰">
      <div class="online-actions">
        <button id="createRoom" type="button">建立線上房間</button>
        <form id="joinRoomForm">
          <label for="roomCodeInput">房號</label>
          <input id="roomCodeInput" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="輸入 6 位房號" autocomplete="off" />
          <button type="submit">加入房間</button>
        </form>
      </div>
      <p class="online-help">建立房間後把 6 位房號或邀請連結傳給朋友；朋友輸入房號加入後即可開始 1 對 1 對戰。</p>
      <div class="room-info" aria-live="polite">
        <span id="roomStatus">本機雙人模式</span>
        <button id="leaveRoom" type="button" hidden>離開房間</button>
      </div>
      <div id="roomShare" class="room-share" hidden>
        <label for="roomCodeDisplay">分享房號</label>
        <input id="roomCodeDisplay" type="text" aria-label="房間號碼" readonly />
        <button id="copyRoomCode" type="button">複製房號</button>
        <button id="shareRoomLink" type="button">分享邀請連結</button>
        <span id="roomShareFeedback" aria-live="polite"></span>
      </div>
    </section>
    <canvas id="gameCanvas" width="1100" height="520"></canvas>
    <div class="status">
      <div id="message">按空白鍵開始遊戲</div>
      <div class="health-bars">
        <div><span class="player-label player1">玩家 1</span> <span id="health1">100</span> / 100</div>
        <div><span class="player-label player2">玩家 2</span> <span id="health2">100</span> / 100</div>
      </div>
      <div class="special-status">
        <div><span class="player-label player1">玩家 1 瞬間移動</span> <span id="skill1">就緒</span></div>
        <div><span class="player-label player2">玩家 2 波動拳</span> <span id="skill2">就緒</span></div>
        <div><span class="player-label player1">玩家 1 勾索</span> <span id="hookStatus">就緒</span></div>
        <div><span class="player-label player2">玩家 2 隱分身</span> <span id="decoyStatus">就緒</span></div>
      </div>
    </div>
    <div class="controls">
      <div>
        <strong>玩家 1</strong><br />移動: A / D，雙連跳: W<br />普攻: S，瞬間移動: Q，勾索: E
      </div>
      <div>
        <strong>玩家 2</strong><br />移動: ← / →，雙連跳: ↑<br />普攻: ↓，波動拳: .，隱分身: /
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
